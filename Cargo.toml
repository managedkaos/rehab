[package]
name = "rehab"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
encoding_rs = "0.8"
chardetng = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
