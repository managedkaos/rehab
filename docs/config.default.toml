# rehab configuration — generated by `rehab init`.
#
# This file reflects rehab's built-in defaults, so with it in place rehab
# behaves exactly as it does with no config at all. Edit it to customize.
#
# Location (same on Linux and macOS; XDG_CONFIG_HOME overrides the base):
#   ~/.config/rehab/config.toml
#
# Regenerate with `rehab init --force`. See docs/config.example.toml for a
# richer, annotated example with custom sequences.

# ---------------------------------------------------------------------------
# default: the sequence used when `-s/--sequence` is not given on the CLI.
# The built-in default chains safe -> wipeup -> unicode-clean.
# ---------------------------------------------------------------------------
default = "default"

# ---------------------------------------------------------------------------
# Sequences: ordered filter chains. The entries below mirror the built-ins so
# you can see and tweak them; a sequence whose name matches a built-in replaces
# it, and a new name extends the set. Available filters:
#
#   safe           replace spaces and shell-problematic characters with `_`
#   wipeup         collapse repeated separators, remove separator before the
#                  last-dot extension only with non-empty base/extension, then
#                  trim leading/trailing separators and dots (keep collapsed
#                  name if trimming would empty it); applies to every component
#   lower          lowercase the name
#   unicode-clean  strip Unicode control/format characters
#   cgi-unescape   decode %XX escapes
# ---------------------------------------------------------------------------

[sequences.default]
filters = ["safe", "wipeup", "unicode-clean"]

[sequences.safe]
filters = ["safe"]

[sequences.safe-lower]
filters = ["safe", "wipeup", "lower"]

[sequences.iso8859_1]
filters = ["cgi-unescape", "safe", "wipeup", "unicode-clean"]

[sequences.utf8]
filters = ["cgi-unescape", "safe", "wipeup", "unicode-clean"]

# ---------------------------------------------------------------------------
# Journal rotation. rehab writes one rename journal per run under the state
# directory (~/.local/state/rehab). These control retention when pruning
# (manually via `rehab journals prune`, or automatically when auto_prune is on).
# Precedence for the keep count: CLI flag > this config > built-in default (20).
# ---------------------------------------------------------------------------
[journal]
# Keep the N most recent journals when pruning (0 = unlimited).
keep = 20
# Prune automatically after each run (opt-in; off by default).
auto_prune = false
